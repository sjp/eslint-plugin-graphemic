name: Publish

# A pushed version tag is the only way this package reaches npm. There is no
# token anywhere: npm trusted publishing exchanges the job's OIDC identity for a
# short-lived credential, which also means the provenance attestation says who
# built the tarball and from which commit.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    # Give this environment a required reviewer in the repository settings to
    # hold a pushed tag until someone approves it. A published version cannot be
    # replaced or unpublished, only superseded.
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      # Trusted publishing needs npm >= 11.5. Node 26 ships one, and printing it
      # means an older runner fails with its version on screen rather than with
      # an authentication error that looks like a misconfigured publisher.
      - run: npm --version
      # Everything CI runs, again, on the exact tree being published. CI has
      # almost certainly run it on this commit already; a couple of minutes is
      # cheap next to a broken exports map that cannot be taken back.
      - run: npm run check
      - run: npm run build
      - run: npm run lint:package
      - name: Check the tag, package.json and built VERSION agree
        run: node .github/scripts/check-version.mjs "$GITHUB_REF_NAME"
      - run: npm publish --provenance --access public
